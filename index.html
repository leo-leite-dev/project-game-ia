<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>game-ia</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        background: #06080f;
        color: #c7d2fe;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 16px;
      }

      #game {
        width: min(100%, 960px);
        aspect-ratio: 16 / 9;
        border: 1px solid #1e2a4a;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
      }

      #game canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      .hint {
        margin: 0;
        font-size: 14px;
        letter-spacing: 0.02em;
        opacity: 0.75;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <p class="hint">Use WASD ou as setas do teclado para mover o quadrado azul.</p>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
